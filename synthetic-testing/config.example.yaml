# Synthetic testing settings. Copy this file to config.yaml (same folder) and edit it.
#
# API key: the scripts read it ONLY from the environment variable ANTHROPIC_API_KEY. Never put a key
# in this file or any other file.
#
# Every run saves a copy of the settings it used, so results stay traceable.
# The scripts send no temperature/top_p/top_k (current Claude models reject them); run-to-run
# variation is handled by repeating each conversation (see `repetitions`).

# ---------------------------------------------------------------------------------------------
# Which model plays each role. `effort` (low / medium / high) trades thoroughness for cost.
# `max_tokens` caps one reply. Model IDs are pinned: results can change when models change, so
# re-test after switching.
roles:
  intake_assistant:        # the AI under test: runs your prompt version with the simulated owner
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 32000      # the final turn carries the whole advisor handoff and record
  simulated_owner:         # plays the business owner; sees only its persona, never your prompt
    model: claude-sonnet-5-5
    effort: low
    max_tokens: 2000
  module_tagger:           # after a run, labels each turn with its module (M1–M13); labels are inferred
    model: claude-haiku-5-5
    effort: low
    max_tokens: 8000
  record_extractor:        # copies the assistant's structured record into a fixed field list;
    model: claude-haiku-5-5   # sees only the handoff, never the conversation
    effort: low
    max_tokens: 16000
  accuracy_checker:        # compares each recorded value with the persona's fact sheet
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 16000
  grader:                  # scores each run on the rubric without knowing which prompt produced it
    model: claude-opus-5-5
    effort: high
    max_tokens: 32000
  pairwise_judge:          # compares two handoffs for the same persona side by side, in both orders
    model: claude-opus-5-5
    effort: high
    max_tokens: 16000
  stress_judge:            # pass/fail on each stress-test persona's expected behaviors
    model: claude-opus-5-5
    effort: high
    max_tokens: 16000
  demographic_checker:     # flags personal/demographic details about the owner in the handoff
    model: claude-sonnet-5-5   # a smaller model over-flagged in our testing
    effort: medium
    max_tokens: 8000
  persona_drafter:         # optional: drafts personas from rows of your own de-identified survey data
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 16000

# ---------------------------------------------------------------------------------------------
conversation:
  max_turns: 60            # safety stop: most intakes finish in 20–40 exchanges
  opening_message: "Hi"    # the owner's fixed first message, identical in every run
  owner_sim_version: v3_unsure_decline   # recorded in each run; v1 turns off the realism directives below

# Realistic-owner settings. Each owner turn, the harness (not the owner model) decides whether the
# owner answers only part of a multi-part question, says "not sure", prefers not to say, misreads
# the question, or drifts off topic. Decisions use the same rules for every prompt and seeded random
# numbers, so two prompt versions face the same owner as closely as possible. A persona file can
# override any of these under `realism:`.
owner_realism_defaults:
  partial_answer_rate: 0.5     # chance of answering only one part of a multi-part question
  unsure_rate: 0.03            # chance of "not sure" on an ordinary question
  unsure_rate_sensitive: 0.07  # ...on a finance or legal question
  decline_rate: 0.01           # chance of "prefer not to say" on an ordinary question
  decline_rate_sensitive: 0.08 # ...on a finance or legal question
                               # ("not sure" is never used for basic facts such as the business name)
  misunderstand_rate: 0.04     # chance of answering a slightly different question
  tangent_rate: 0.0            # chance of a short off-topic aside (raise for rambling personas)
  fatigue:                     # answers get shorter as the conversation goes on
    start_after_turns: 8       # owner turns at full length
    half_after_turns: 24       # by this owner turn, the length target has halved
    floor_share: 0.35          # the target never drops below this share of the persona's maximum
  length_regen_factor: 2.0     # redo a reply once if it is more than this multiple of the target

# ---------------------------------------------------------------------------------------------
# Grids: which prompt versions and personas to run, and how many repetitions of each pair.
# Prompt names come from prompts/registry.yaml; persona names are files in personas/ (without .yaml).
# Run a grid with:  python scripts/run_intake.py --grid example_grid
pilot:                     # the default grid (used when no --grid is given)
  prompts: [first_revision, consolidated_current]
  personas: [your_persona]
  repetitions: 2

example_grid:
  prompts: [first_revision, consolidated_current]
  personas: [your_persona, another_persona]
  stress_personas: []      # stress-test personas (scored pass/fail, kept out of the averages)
  repetitions: 2

# ---------------------------------------------------------------------------------------------
budget_usd: 20             # every script stops once recorded spending reaches this (data/spend_ledger.jsonl)

human_check:               # for scripts/export_for_human_scoring.py
  sample_size: 6           # how many runs to export for a person to judge
  seed: 1                  # change for a different random sample

# Prices in US dollars per million tokens, used only to estimate and cap spending.
# Check current prices before relying on them. cache_write = 1.25 x input (5-minute cache).
pricing_usd_per_mtok:
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_write: 0.125, cache_read: 0.01}
